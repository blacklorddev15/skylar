<div id="tab-migration" class="tab-content">
  <div class="card">
    <div class="card-title">Pterodactyl & Server Migration Settings</div>
    <p class="field-tip" style="margin-bottom: 14px;">Update your panel domain, server IP, or allocation port here when changing servers. Changes take effect instantly without touching Vercel!</p>
    
    <div class="form-group" style="margin-bottom: 12px;">
      <label for="migPanelDomain">PTERODACTYL PANEL DOMAIN</label>
      <input type="text" id="migPanelDomain" value="https://pterodactyl.mzazi.shop" style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:monospace; font-size:0.8rem;">
    </div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
      <div class="form-group">
        <label for="migServerIp">SERVER IP / HOST</label>
        <input type="text" id="migServerIp" value="139.59.111.210" style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:monospace; font-size:0.8rem;">
      </div>
      <div class="form-group">
        <label for="migServerPort">ALLOCATION PORT</label>
        <input type="text" id="migServerPort" value="25572" style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:monospace; font-size:0.8rem;">
      </div>
    </div>
    
    <button type="button" class="action-btn primary" onclick="saveMigrationSettings()" style="width:100%;">Save Panel Settings</button>
    <div id="migSaveStatus" class="field-tip" style="margin-top: 8px; text-align: center; color: #34d399;" hidden>Panel settings saved live on server!</div>
  </div>
</div>
<script>
  let activeAdminPassword = 'skylar10';

  async function saveMigrationSettings() {
    const panelDomain = document.getElementById('migPanelDomain').value.trim();
    const serverIp = document.getElementById('migServerIp').value.trim();
    const serverPort = document.getElementById('migServerPort').value.trim();
    const status = document.getElementById('migSaveStatus');

    try {
      const response = await fetch('/api/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': activeAdminPassword },
        body: JSON.stringify({ action: 'update_settings', panelDomain, serverIp, serverPort, password: activeAdminPassword })
      });
      const data = await response.json();
      if (response.ok && data.success) {
        status.textContent = 'Panel settings saved live on server!';
        status.style.color = '#34d399';
        status.hidden = false;
        setTimeout(() => { status.hidden = true; }, 3000);
      } else {
        status.textContent = data.error || 'Failed to save settings.';
        status.style.color = '#f87171';
        status.hidden = false;
      }
    } catch (e) {
      status.textContent = 'Connection error saving settings.';
      status.style.color = '#f87171';
      status.hidden = false;
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('/api/pair?stats=1');
      const data = await res.json();
      if (data.panelDomain) document.getElementById('migPanelDomain').value = data.panelDomain;
      if (data.serverIp) document.getElementById('migServerIp').value = data.serverIp;
      if (data.serverPort) document.getElementById('migServerPort').value = data.serverPort;
    } catch {}
  });
</script>
