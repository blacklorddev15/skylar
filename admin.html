<!-- Migration & Panel Domain Settings Tab -->
<div id="tab-migration" class="tab-content">
  <div class="card">
    <div class="card-title">Pterodactyl & Server Migration Settings</div>
    <p class="field-tip" style="margin-bottom: 14px;">Update your panel domain, server IP, or allocation port here when changing servers. Changes take effect instantly without touching Vercel!</p>
    
    <div class="form-group" style="margin-bottom: 12px;">
      <label for="migPanelDomain">PTERODACTYL PANEL DOMAIN</label>
      <input type="text" id="migPanelDomain" value="https://pterodactyl.mzazi.shop" style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:monospace; font-size:0.8rem;">
    </div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
      <div class="form-group">
        <label for="migServerIp">SERVER IP / HOST</label>
        <input type="text" id="migServerIp" value="139.59.111.210" style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:monospace; font-size:0.8rem;">
      </div>
      <div class="form-group">
        <label for="migServerPort">ALLOCATION PORT</label>
        <input type="text" id="migServerPort" value="25572" style="width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:monospace; font-size:0.8rem;">
      </div>
    </div>
    
    <button type="button" class="action-btn primary" onclick="saveMigrationSettings()" style="width:100%;">Save Panel Settings</button>
    <div id="migSaveStatus" class="field-tip" style="margin-top: 8px; text-align: center; color: #34d399;" hidden>Panel settings saved successfully!</div>
  </div>
</div>
<script>
  function saveMigrationSettings() {
    const domain = document.getElementById('migPanelDomain').value;
    const ip = document.getElementById('migServerIp').value;
    const port = document.getElementById('migServerPort').value;
    localStorage.setItem('skylar_panel_domain', domain);
    localStorage.setItem('skylar_server_ip', ip);
    localStorage.setItem('skylar_server_port', port);
    const status = document.getElementById('migSaveStatus');
    status.hidden = false;
    setTimeout(() => { status.hidden = true; }, 3000);
  }
  // Load saved settings if present
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('skylar_panel_domain')) {
      document.getElementById('migPanelDomain').value = localStorage.getItem('skylar_panel_domain');
    }
    if (localStorage.getItem('skylar_server_ip')) {
      document.getElementById('migServerIp').value = localStorage.getItem('skylar_server_ip');
    }
    if (localStorage.getItem('skylar_server_port')) {
      document.getElementById('migServerPort').value = localStorage.getItem('skylar_server_port');
    }
  });
</script>
